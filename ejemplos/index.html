<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplos — Ziv</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="stylesheet" href="../shared/styles-base.css">
  <style>
    body { font-family: system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }
    .wrap { max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
    .eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin-bottom: 6px; }
    h1 { font-size: 22px; font-weight: 700; margin: 0 0 8px; }
    .sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }
    .sandbox {
      background: var(--bg-card); border: 1px solid var(--border-primary);
      border-radius: 16px; padding: 20px; margin-bottom: 16px;
    }
    .sandbox-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .sandbox-empty { font-size: 13px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Página privada · sin link en el menú</div>
    <h1>Ejemplos</h1>
    <p class="sub">Sandbox para probar cositas nuevas antes de meterlas en el sitio de verdad. No requiere login, no está linkeada desde ningún lado.</p>

    <div class="sandbox">
      <div class="sandbox-title">Todavía nada por acá</div>
      <div class="sandbox-empty">Cuando quiera mostrarte algo lo agrego arriba de este bloque.</div>
    </div>
  </div>

  <script src="../shared/ui-utils.js?v=1.7"></script>
</body>
</html>
